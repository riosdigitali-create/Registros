<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel — Registro de un Amar Salvaje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F4C5C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23F7F4EE' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --marfil:#F7F4EE; --marfil-2:#EFEAE0; --carbon:#2E2E2E; --carbon-soft:#4a4a48;
  --petroleo:#0F4C5C; --petroleo-2:#0c3d4a; --terracota:#C86A4A; --violeta:#7B5B8C;
  --linea:#d9d2c4;
  --font-script:'Dancing Script', cursive;
  --font-serif:'EB Garamond', Georgia, serif;
  --font-sans:'Jost', system-ui, sans-serif;
  --sombra:0 20px 60px -30px rgba(46,46,46,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-serif);color:var(--carbon);background:var(--marfil);line-height:1.6}
a{color:var(--petroleo)}
.oculto{display:none !important}

/* ---------- botones y campos ---------- */
.btn{
  display:inline-block;text-decoration:none;text-align:center;
  font-family:var(--font-sans);font-size:.9rem;letter-spacing:.02em;
  background:var(--petroleo);color:var(--marfil);border:none;border-radius:999px;
  padding:11px 22px;cursor:pointer;transition:background .2s,transform .2s;
}
.btn:hover{background:var(--petroleo-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.fantasma{background:transparent;color:var(--petroleo);border:1px solid var(--linea)}
.btn.fantasma:hover{background:var(--marfil-2)}
.btn.terra{background:var(--terracota)}
.btn.terra:hover{background:#b45b3d}
.btn.chico{padding:7px 15px;font-size:.82rem}
label{display:block;font-family:var(--font-sans);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--carbon-soft);margin-bottom:7px}
input,textarea,select{
  width:100%;font-family:var(--font-serif);font-size:1rem;color:var(--carbon);
  background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px;
}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(15,76,92,.25);border-color:var(--petroleo)}
textarea{min-height:130px;resize:vertical;line-height:1.7}
.campo{margin-bottom:18px}
.campos-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- entrada ---------- */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--petroleo);
  background-image:linear-gradient(160deg,#0F4C5C 0%,#0c3d4a 60%,#123f4d 100%)}
.entrada-caja{width:min(420px,100%);background:var(--marfil);border-radius:22px;
  padding:44px 38px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6);text-align:center}
.entrada-caja h1{font-family:var(--font-script);font-weight:700;font-size:2.3rem;
  color:var(--petroleo);line-height:1.15;margin-bottom:6px}
.entrada-caja .sub{font-family:var(--font-sans);font-size:.74rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--carbon-soft);margin-bottom:30px}
.entrada-caja input{text-align:center;letter-spacing:.3em;font-size:1.2rem}
.entrada-caja .btn{width:100%;margin-top:16px}
.error{font-family:var(--font-sans);font-size:.85rem;color:#8d3f24;
  background:rgba(200,106,74,.1);border:1px solid rgba(200,106,74,.28);
  border-radius:10px;padding:10px 14px;margin-top:16px;text-align:left}

/* ---------- estructura ---------- */
.barra{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.barra-in{max-width:1180px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.marca{font-family:var(--font-script);font-weight:700;font-size:1.5rem;color:var(--petroleo);line-height:1}
.marca small{display:block;font-family:var(--font-sans);font-size:.6rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--carbon-soft);margin-top:2px}
.pestanas{display:flex;gap:6px;margin-left:auto}
.pestana{font-family:var(--font-sans);font-size:.85rem;padding:9px 18px;border-radius:999px;
  border:1px solid transparent;background:none;cursor:pointer;color:var(--carbon-soft)}
.pestana.on{background:var(--petroleo);color:var(--marfil)}
.pestana .globo{display:inline-block;min-width:19px;padding:0 6px;margin-left:7px;
  background:var(--terracota);color:#fff;border-radius:999px;font-size:.7rem;line-height:19px}
.pestana.on .globo{background:rgba(255,255,255,.25)}
main{max-width:1180px;margin:0 auto;padding:30px 24px 90px}
.titulo-seccion{font-family:var(--font-script);font-weight:700;font-size:2rem;
  color:var(--petroleo);margin-bottom:4px}
.bajada{font-size:1rem;color:var(--carbon-soft);margin-bottom:24px}

/* ---------- herramientas ---------- */
.herramientas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.herramientas input[type=search]{max-width:280px}
.filtro{font-family:var(--font-sans);font-size:.82rem;padding:7px 15px;border-radius:999px;
  border:1px solid var(--linea);background:#fff;cursor:pointer;color:var(--carbon-soft)}
.filtro.on{background:var(--petroleo);color:var(--marfil);border-color:var(--petroleo)}
.derecha{margin-left:auto;display:flex;gap:10px}

/* ---------- mensajes ---------- */
.lista{display:grid;gap:14px}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:20px 22px;
  cursor:pointer;transition:box-shadow .2s,transform .2s;position:relative}
.tarjeta:hover{box-shadow:var(--sombra);transform:translateY(-2px)}
.tarjeta.sinleer{border-left:4px solid var(--terracota)}
.tarjeta.archivada{opacity:.6}
.tarjeta-alto{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tarjeta h3{font-family:var(--font-serif);font-weight:600;font-size:1.2rem}
.sello{font-family:var(--font-sans);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px;background:var(--marfil-2);color:var(--carbon-soft)}
.sello.general{background:rgba(15,76,92,.12);color:var(--petroleo)}
.sello.personales{background:rgba(200,106,74,.14);color:#8d3f24}
.sello.artisticos{background:rgba(123,91,140,.14);color:#5c4269}
.fecha{font-family:var(--font-sans);font-size:.78rem;color:var(--carbon-soft);margin-left:auto}
.tarjeta p.extracto{color:var(--carbon-soft);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.vacio{text-align:center;padding:70px 20px;color:var(--carbon-soft);
  border:1px dashed var(--linea);border-radius:16px}
.vacio .grande{font-family:var(--font-script);font-size:1.8rem;color:var(--petroleo);margin-bottom:6px}

/* ---------- ficha ---------- */
.velo{position:fixed;inset:0;background:rgba(20,20,20,.55);backdrop-filter:blur(3px);
  z-index:60;display:grid;place-items:center;padding:24px;overflow:auto}
.ficha{width:min(720px,100%);background:var(--marfil);border-radius:20px;
  padding:34px 34px 28px;box-shadow:0 40px 90px -40px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
.ficha h2{font-family:var(--font-script);font-weight:700;font-size:2rem;color:var(--petroleo);margin:6px 0 2px}
.ficha .datos{display:grid;gap:12px;margin:20px 0}
.dato{display:grid;grid-template-columns:170px 1fr;gap:14px;padding-bottom:12px;
  border-bottom:1px dotted var(--linea)}
.dato .k{font-family:var(--font-sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--carbon-soft);padding-top:3px}
.dato .v{word-break:break-word}
.ficha .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;
  padding-top:20px;border-top:1px solid var(--linea)}
.cerrar{float:right;background:none;border:none;font-size:1.7rem;line-height:1;
  cursor:pointer;color:var(--carbon-soft)}

/* ---------- bitácora ---------- */
.entrada-fila{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--linea);
  border-radius:16px;padding:14px 18px}
.entrada-fila img{width:74px;height:56px;object-fit:cover;border-radius:10px;background:var(--marfil-2);flex:none}
.entrada-fila .cuerpo{flex:1;min-width:0}
.entrada-fila h4{font-size:1.08rem;font-weight:600}
.entrada-fila .meta{font-family:var(--font-sans);font-size:.76rem;color:var(--carbon-soft)}
.borrador{background:var(--marfil-2);color:var(--carbon-soft)}
#editorCaja{scroll-margin-top:96px}
.editor{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:30px;margin-bottom:26px}
.editor h3{font-family:var(--font-script);font-weight:700;font-size:1.7rem;color:var(--petroleo);margin-bottom:18px}
.subida{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.subida .previa{width:96px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--linea)}
.galeria-previa{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.galeria-previa figure{position:relative;width:104px}
.galeria-previa img{width:104px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--linea)}
.galeria-previa button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;
  border:none;background:var(--terracota);color:#fff;cursor:pointer;font-size:.9rem;line-height:24px}
.archivo-real{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.boton-archivo{display:inline-block;margin:0;font-family:var(--font-sans);font-size:.82rem;
  letter-spacing:.02em;text-transform:none;color:var(--petroleo);background:transparent;
  border:1px solid var(--linea);border-radius:999px;padding:7px 15px;cursor:pointer}
.boton-archivo:hover{background:var(--marfil-2)}
.ayuda{font-family:var(--font-sans);font-size:.78rem;color:var(--carbon-soft);margin-top:6px}
.aviso{font-family:var(--font-sans);font-size:.88rem;border-radius:12px;padding:12px 16px;margin-bottom:18px}
.aviso.ok{background:rgba(15,76,92,.09);color:var(--petroleo);border:1px solid rgba(15,76,92,.2)}
.aviso.mal{background:rgba(200,106,74,.1);color:#8d3f24;border:1px solid rgba(200,106,74,.28)}
.cargando{font-family:var(--font-sans);font-size:.85rem;color:var(--carbon-soft);padding:30px;text-align:center}

@media(max-width:760px){
  .campos-2{grid-template-columns:1fr}
  .dato{grid-template-columns:1fr;gap:2px}
  .pestanas{margin-left:0;width:100%}
  .derecha{margin-left:0;width:100%}
}
</style>
</head>
<body>

<!-- ============ ENTRADA ============ -->
<div class="entrada" id="pantallaEntrada">
  <form class="entrada-caja" id="formEntrada">
    <h1>Registro de un<br>Amar Salvaje</h1>
    <p class="sub">Panel privado</p>
    <div class="campo" style="margin-bottom:0;text-align:left">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    <div id="errorEntrada"></div>
  </form>
</div>

<!-- ============ PANEL ============ -->
<div id="pantallaPanel" class="oculto">
  <div class="barra">
    <div class="barra-in">
      <div class="marca">Registro de un Amar Salvaje<small>Panel privado</small></div>
      <div class="pestanas">
        <button class="pestana on" data-vista="mensajes">Mensajes <span class="globo oculto" id="globoSinLeer">0</span></button>
        <button class="pestana" data-vista="bitacora">Bitácora</button>
        <button class="pestana" id="btnSalir">Salir</button>
      </div>
    </div>
  </div>

  <main>
    <!-- ---------- MENSAJES ---------- -->
    <section id="vistaMensajes">
      <h2 class="titulo-seccion">Lo que te han escrito</h2>
      <p class="bajada">Todo lo que llega por los formularios de la página aparece aquí.</p>

      <div class="herramientas">
        <button class="filtro on" data-filtro="todos">Todos</button>
        <button class="filtro" data-filtro="sinleer">Sin leer</button>
        <button class="filtro" data-filtro="archivados">Archivados</button>
        <input type="search" id="buscador" placeholder="Buscar por nombre, correo o texto…">
        <div class="derecha">
          <button class="btn fantasma chico" id="btnActualizar">Actualizar</button>
          <button class="btn fantasma chico" id="btnExportar">Exportar CSV</button>
        </div>
      </div>

      <div class="lista" id="listaMensajes"><p class="cargando">Cargando…</p></div>
    </section>

    <!-- ---------- BITÁCORA ---------- -->
    <section id="vistaBitacora" class="oculto">
      <h2 class="titulo-seccion">Tu bitácora</h2>
      <p class="bajada">Escribe una entrada, súbele fotos, audio, video o un mapa, y publícala en la página.</p>

      <div class="herramientas">
        <button class="btn" id="btnNueva">Escribir una entrada nueva</button>
        <div class="derecha">
          <button class="btn fantasma chico" id="btnActualizarBit">Actualizar</button>
        </div>
      </div>

      <div id="editorCaja" class="oculto"></div>
      <div class="lista" id="listaEntradas"><p class="cargando">Cargando…</p></div>
    </section>
  </main>
</div>

<div id="velo"></div>

<script src="nube.js"></script>
<script>
/* ============================================================
   PANEL PRIVADO — Registro de un Amar Salvaje
   ============================================================ */
const $  = (s, c) => (c || document).querySelector(s);
const $$ = (s, c) => Array.from((c || document).querySelectorAll(s));

const esc = (t) => String(t == null ? "" : t)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

const MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

function fechaLarga(valor){
  const d = new Date(valor);
  if(isNaN(d)) return String(valor || "");
  return d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
}
function fechaHora(valor){
  const d = new Date(valor);
  if(isNaN(d)) return String(valor || "");
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return fechaLarga(valor) + ", " + hh + ":" + mm + " h";
}
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
         "-" + String(d.getDate()).padStart(2, "0");
}

/* ==========================================================
   SESIÓN
   ========================================================== */
const LLAVE_SESION = "registro_panel_sesion";
let sesion = null;

function guardarSesion(s){
  sesion = s;
  try { sessionStorage.setItem(LLAVE_SESION, JSON.stringify(s)); } catch(e){}
}
function leerSesion(){
  try {
    const s = JSON.parse(sessionStorage.getItem(LLAVE_SESION) || "null");
    if(s && s.access_token) sesion = s;
  } catch(e){}
  return sesion;
}
function borrarSesion(){
  sesion = null;
  try { sessionStorage.removeItem(LLAVE_SESION); } catch(e){}
}

async function entrar(clave){
  const r = await fetch(NUBE.url + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: NUBE.clave, "Content-Type": "application/json" },
    body: JSON.stringify({ email: NUBE.usuario, password: clave }),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok || !d.access_token){
    throw new Error(d.error_description || d.msg || "La contraseña no es correcta.");
  }
  guardarSesion(d);
  return d;
}

async function renovarSesion(){
  if(!sesion || !sesion.refresh_token) return false;
  const r = await fetch(NUBE.url + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: NUBE.clave, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: sesion.refresh_token }),
  });
  if(!r.ok) return false;
  const d = await r.json();
  if(!d.access_token) return false;
  guardarSesion(d);
  return true;
}

/* Llamada a la base con la sesión puesta. Si el permiso caducó,
   lo renueva una vez y vuelve a intentar. */
async function api(ruta, opciones, reintento){
  opciones = opciones || {};
  const cab = Object.assign({
    apikey: NUBE.clave,
    Authorization: "Bearer " + (sesion ? sesion.access_token : ""),
  }, opciones.headers || {});
  const r = await fetch(NUBE.url + ruta, Object.assign({}, opciones, { headers: cab }));
  if((r.status === 401 || r.status === 403) && !reintento){
    if(await renovarSesion()) return api(ruta, opciones, true);
    salir();
    throw new Error("La sesión caducó. Vuelve a entrar.");
  }
  if(!r.ok) throw new Error("La base respondió " + r.status + ".");
  if(r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

function salir(){
  borrarSesion();
  $("#pantallaPanel").classList.add("oculto");
  $("#pantallaEntrada").classList.remove("oculto");
  $("#clave").value = "";
}

$("#formEntrada").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#btnEntrar");
  const err = $("#errorEntrada");
  err.innerHTML = "";
  btn.disabled = true; btn.textContent = "Entrando…";
  try {
    await entrar($("#clave").value.trim());
    abrirPanel();
  } catch(ex){
    err.innerHTML = '<div class="error">' + esc(ex.message) + "</div>";
  } finally {
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

$("#btnSalir").addEventListener("click", salir);

function abrirPanel(){
  $("#pantallaEntrada").classList.add("oculto");
  $("#pantallaPanel").classList.remove("oculto");
  cargarMensajes();
  cargarEntradas();
}

/* ==========================================================
   PESTAÑAS
   ========================================================== */
$$(".pestana[data-vista]").forEach(b => b.addEventListener("click", () => {
  $$(".pestana[data-vista]").forEach(x => x.classList.toggle("on", x === b));
  const v = b.dataset.vista;
  $("#vistaMensajes").classList.toggle("oculto", v !== "mensajes");
  $("#vistaBitacora").classList.toggle("oculto", v !== "bitacora");
}));

/* ==========================================================
   MENSAJES
   ========================================================== */
const ORIGENES = {
  general:    "Contacto general",
  personales: "Historias personales",
  artisticos: "Proyectos artísticos",
};

/* Nombres bonitos para las preguntas de cada camino. */
const PREGUNTAS = {
  ocasion:  "Qué quiere conservar",
  material: "Material que tiene",
  fecha:    "Para cuándo",
  historia: "Su historia",
  tipo:     "Tipo de proyecto",
  etapa:    "Etapa",
  rol:      "Qué necesita",
  fechas:   "Fechas y presupuesto",
  proyecto: "El proyecto",
  nombre:   "Nombre",
  correo:   "Correo",
  telefono: "Teléfono",
  mensaje:  "Mensaje",
};

let mensajes = [];
let filtroMensajes = "todos";
let busqueda = "";

async function cargarMensajes(){
  const cont = $("#listaMensajes");
  cont.innerHTML = '<p class="cargando">Cargando…</p>';
  try {
    mensajes = await api("/rest/v1/mensajes?select=*&order=creado_en.desc") || [];
    pintarMensajes();
  } catch(ex){
    cont.innerHTML = '<div class="aviso mal">' + esc(ex.message) + "</div>";
  }
}

function mensajesVisibles(){
  const t = busqueda.trim().toLowerCase();
  return mensajes.filter(m => {
    if(filtroMensajes === "sinleer"    && (m.leido || m.archivado)) return false;
    if(filtroMensajes === "archivados" && !m.archivado) return false;
    if(filtroMensajes === "todos"      && m.archivado) return false;
    if(!t) return true;
    const paja = [m.nombre, m.correo, m.telefono, m.mensaje,
                  JSON.stringify(m.respuestas || {})].join(" ").toLowerCase();
    return paja.indexOf(t) >= 0;
  });
}

function pintarMensajes(){
  const cont = $("#listaMensajes");
  const lista = mensajesVisibles();

  const sinLeer = mensajes.filter(m => !m.leido && !m.archivado).length;
  const globo = $("#globoSinLeer");
  globo.textContent = sinLeer;
  globo.classList.toggle("oculto", sinLeer === 0);

  if(!lista.length){
    cont.innerHTML = '<div class="vacio"><p class="grande">Nada por aquí todavía</p>' +
      "<p>Cuando alguien llene un formulario de la página, su mensaje aparece en esta lista.</p></div>";
    return;
  }

  cont.innerHTML = lista.map(m => {
    const extracto = m.mensaje || Object.values(m.respuestas || {}).join(" · ");
    return '<article class="tarjeta ' + (m.leido ? "" : "sinleer") +
      (m.archivado ? " archivada" : "") + '" data-id="' + esc(m.id) + '">' +
      '<div class="tarjeta-alto">' +
        '<h3>' + esc(m.nombre || "Sin nombre") + "</h3>" +
        '<span class="sello ' + esc(m.origen) + '">' + esc(ORIGENES[m.origen] || m.origen) + "</span>" +
        (m.archivado ? '<span class="sello">Archivado</span>' : "") +
        '<span class="fecha">' + esc(fechaHora(m.creado_en)) + "</span>" +
      "</div>" +
      '<p class="extracto">' + esc(extracto) + "</p>" +
    "</article>";
  }).join("");
}

$("#listaMensajes").addEventListener("click", (e) => {
  const t = e.target.closest("[data-id]");
  if(t) abrirFicha(t.dataset.id);
});

$$(".filtro").forEach(b => b.addEventListener("click", () => {
  $$(".filtro").forEach(x => x.classList.toggle("on", x === b));
  filtroMensajes = b.dataset.filtro;
  pintarMensajes();
}));

$("#buscador").addEventListener("input", (e) => { busqueda = e.target.value; pintarMensajes(); });
$("#btnActualizar").addEventListener("click", cargarMensajes);

function abrirFicha(id){
  const m = mensajes.find(x => x.id === id);
  if(!m) return;

  const filas = [];
  const agrega = (k, v) => { if(v) filas.push('<div class="dato"><div class="k">' + esc(k) +
    '</div><div class="v">' + esc(v) + "</div></div>"); };

  agrega("Recibido", fechaHora(m.creado_en));
  agrega("Viene de", ORIGENES[m.origen] || m.origen);
  agrega("Nombre", m.nombre);
  agrega("Correo", m.correo);
  agrega("Teléfono", m.telefono);
  Object.keys(m.respuestas || {}).forEach(k => {
    if(k === "nombre" || k === "correo" || k === "mensaje") return;
    agrega(PREGUNTAS[k] || k, m.respuestas[k]);
  });
  if(m.mensaje) agrega("Mensaje", m.mensaje);

  const tel = String(m.telefono || "").replace(/[^0-9]/g, "");
  const asunto = encodeURIComponent("Sobre tu mensaje en Registro de un Amar Salvaje");

  abrirVelo(
    '<button class="cerrar" data-cerrar>&times;</button>' +
    '<span class="sello ' + esc(m.origen) + '">' + esc(ORIGENES[m.origen] || m.origen) + "</span>" +
    "<h2>" + esc(m.nombre || "Sin nombre") + "</h2>" +
    '<p class="ayuda">' + esc(fechaHora(m.creado_en)) + "</p>" +
    '<div class="datos">' + filas.join("") + "</div>" +
    '<div class="acciones">' +
      (m.correo ? '<a class="btn" href="mailto:' + esc(m.correo) + "?subject=" + asunto + '">Responder por correo</a>' : "") +
      (tel ? '<a class="btn terra" target="_blank" rel="noopener" href="https://wa.me/' + esc(tel) + '">Responder por WhatsApp</a>' : "") +
      '<button class="btn fantasma" data-accion="leido">' + (m.leido ? "Marcar como no leído" : "Marcar como leído") + "</button>" +
      '<button class="btn fantasma" data-accion="archivar">' + (m.archivado ? "Desarchivar" : "Archivar") + "</button>" +
      '<button class="btn fantasma" data-accion="borrar">Eliminar</button>' +
    "</div>",
    async (accion, cerrar) => {
      if(accion === "leido")    await cambiarMensaje(m.id, { leido: !m.leido });
      if(accion === "archivar") await cambiarMensaje(m.id, { archivado: !m.archivado, leido: true });
      if(accion === "borrar"){
        if(!confirm("¿Eliminar este mensaje para siempre?")) return;
        await api("/rest/v1/mensajes?id=eq." + m.id, { method: "DELETE" });
        mensajes = mensajes.filter(x => x.id !== m.id);
        pintarMensajes();
      }
      cerrar();
    }
  );

  if(!m.leido) cambiarMensaje(m.id, { leido: true });
}

async function cambiarMensaje(id, cambios){
  await api("/rest/v1/mensajes?id=eq." + id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json", Prefer: "return=minimal" },
    body: JSON.stringify(cambios),
  });
  const m = mensajes.find(x => x.id === id);
  if(m) Object.assign(m, cambios);
  pintarMensajes();
}

/* ---------- exportar ---------- */
$("#btnExportar").addEventListener("click", () => {
  const lista = mensajesVisibles();
  if(!lista.length) return alert("No hay mensajes que exportar.");
  const cols = ["creado_en","origen","nombre","correo","telefono","mensaje","respuestas","leido","archivado"];
  const celda = (v) => '"' + String(v == null ? "" : (typeof v === "object" ? JSON.stringify(v) : v))
    .replace(/"/g, '""') + '"';
  const csv = "﻿" + cols.join(",") + "\n" +
    lista.map(m => cols.map(c => celda(m[c])).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "mensajes-" + hoyISO() + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

/* ==========================================================
   VELO / FICHA
   ========================================================== */
function abrirVelo(html, alAccionar){
  const velo = $("#velo");
  velo.className = "velo";
  velo.innerHTML = '<div class="ficha">' + html + "</div>";
  const cerrar = () => { velo.className = ""; velo.innerHTML = ""; document.body.style.overflow = ""; };
  document.body.style.overflow = "hidden";
  velo.onclick = (e) => {
    if(e.target === velo || e.target.closest("[data-cerrar]")) return cerrar();
    const b = e.target.closest("[data-accion]");
    if(b && alAccionar) alAccionar(b.dataset.accion, cerrar);
  };
  document.onkeydown = (e) => { if(e.key === "Escape") cerrar(); };
}

const CATEGORIAS = ["Lugares", "Miradas", "Detrás de las historias", "Bitácora", "Amar Salvaje"];
let entradas = [];

async function cargarEntradas(){
  const cont = $("#listaEntradas");
  cont.innerHTML = '<p class="cargando">Cargando…</p>';
  try {
    entradas = await api("/rest/v1/bitacora?select=*&order=fecha.desc") || [];
    pintarEntradas();
  } catch(ex){
    cont.innerHTML = '<div class="aviso mal">' + esc(ex.message) + "</div>";
  }
}

function pintarEntradas(){
  const cont = $("#listaEntradas");
  if(!entradas.length){
    cont.innerHTML = '<div class="vacio"><p class="grande">Todavía no has escrito nada aquí</p>' +
      '<p>Empieza con el botón «Escribir una entrada nueva».</p></div>';
    return;
  }
  cont.innerHTML = entradas.map(e => {
    const medios = [];
    if(e.video) medios.push("video");
    if(e.audio) medios.push("audio");
    if(e.mapa)  medios.push("mapa");
    if((e.fotos || []).length) medios.push((e.fotos || []).length + " fotos");
    return '<article class="entrada-fila">' +
      (e.portada ? '<img src="' + esc(e.portada) + '" alt="" onerror="this.remove()">' : "") +
      '<div class="cuerpo">' +
        "<h4>" + esc(e.titulo) + "</h4>" +
        '<div class="meta">' + esc(fechaLarga(e.fecha)) + " · " + esc(e.categoria) +
        (medios.length ? " · " + esc(medios.join(", ")) : "") + "</div>" +
      "</div>" +
      (e.publicado ? "" : '<span class="sello borrador">Borrador</span>') +
      '<button class="btn fantasma chico" data-editar="' + esc(e.id) + '">Editar</button>' +
      '<button class="btn fantasma chico" data-borrar="' + esc(e.id) + '">Eliminar</button>' +
    "</article>";
  }).join("");
}

$("#listaEntradas").addEventListener("click", async (ev) => {
  const ed = ev.target.closest("[data-editar]");
  if(ed) return abrirEditor(entradas.find(x => x.id === ed.dataset.editar));
  const bo = ev.target.closest("[data-borrar]");
  if(bo){
    if(!confirm("¿Eliminar esta entrada de la bitácora?")) return;
    await api("/rest/v1/bitacora?id=eq." + bo.dataset.borrar, { method: "DELETE" });
    entradas = entradas.filter(x => x.id !== bo.dataset.borrar);
    pintarEntradas();
  }
});

$("#btnNueva").addEventListener("click", () => abrirEditor(null));
$("#btnActualizarBit").addEventListener("click", cargarEntradas);

let fotosEditor = [];

function abrirEditor(e){
  e = e || {};
  fotosEditor = Array.isArray(e.fotos) ? e.fotos.slice() : [];

  const caja = $("#editorCaja");
  caja.classList.remove("oculto");
  caja.innerHTML =
  '<form class="editor" id="formEntradaBit">' +
    "<h3>" + (e.id ? "Editar la entrada" : "Una entrada nueva") + "</h3>" +
    '<div id="avisoEditor"></div>' +

    '<div class="campos-2">' +
      '<div class="campo"><label for="eFecha">Fecha</label>' +
        '<input id="eFecha" type="date" value="' + esc(e.fecha || hoyISO()) + '"></div>' +
      '<div class="campo"><label for="eCategoria">Categoría</label><select id="eCategoria">' +
        CATEGORIAS.map(c => '<option' + (c === (e.categoria || "Bitácora") ? " selected" : "") +
          ">" + esc(c) + "</option>").join("") +
      "</select></div>" +
    "</div>" +

    '<div class="campo"><label for="eTitulo">Título</label>' +
      '<input id="eTitulo" value="' + esc(e.titulo || "") + '" placeholder="El mercado antes de que amanezca" required></div>' +

    '<div class="campo"><label for="eResumen">Resumen — las dos líneas que se ven en la tarjeta</label>' +
      '<input id="eResumen" value="' + esc(e.resumen || "") + '" placeholder="Voces, cajas de fruta y una luz que todavía no decide de qué color será el día."></div>' +

    '<div class="campo"><label>Foto de portada</label>' +
      '<div class="subida">' +
        '<img class="previa' + (e.portada ? "" : " oculto") + '" id="ePortadaPrevia" src="' + esc(e.portada || "") + '" alt="">' +
        '<label class="boton-archivo" for="ePortadaArchivo">Elegir una foto</label>' +
        '<input type="file" id="ePortadaArchivo" accept="image/*" class="archivo-real">' +
        (e.portada ? '<button type="button" class="btn fantasma chico" id="eQuitarPortada">Quitar</button>' : "") +
      "</div>" +
      '<p class="ayuda">Se sube sola al elegirla. Aguanta hasta 50 MB por archivo.</p></div>' +

    '<div class="campo"><label for="eTexto">El texto</label>' +
      '<textarea id="eTexto" placeholder="Escribe con calma. Deja un renglón en blanco entre párrafo y párrafo.">' +
      esc(e.texto || "") + "</textarea>" +
      '<p class="ayuda">Cada renglón en blanco separa un párrafo.</p></div>' +

    '<div class="campo"><label>Más fotos (galería)</label>' +
      '<label class="boton-archivo" for="eFotosArchivos">Elegir varias fotos</label>' +
      '<input type="file" id="eFotosArchivos" accept="image/*" multiple class="archivo-real">' +
      '<div class="galeria-previa" id="eGaleria"></div></div>' +

    '<div class="campos-2">' +
      '<div class="campo"><label for="eVideo">Video (enlace de YouTube, Vimeo o Drive)</label>' +
        '<input id="eVideo" value="' + esc(e.video || "") + '" placeholder="https://youtu.be/…"></div>' +
      '<div class="campo"><label for="eAudioArchivo">Audio (sube un mp3)</label>' +
        '<label class="boton-archivo" for="eAudioArchivo">Elegir un audio</label>' +
        '<input type="file" id="eAudioArchivo" accept="audio/*" class="archivo-real">' +
        '<input id="eAudio" value="' + esc(e.audio || "") + '" placeholder="…o pega aquí un enlace" style="margin-top:8px"></div>' +
    "</div>" +

    '<div class="campos-2">' +
      '<div class="campo"><label for="eMapa">Mapa (enlace de Google Maps)</label>' +
        '<input id="eMapa" value="' + esc(e.mapa || "") + '" placeholder="https://maps.app.goo.gl/…"></div>' +
      '<div class="campo"><label for="eLugar">Nombre del lugar</label>' +
        '<input id="eLugar" value="' + esc(e.lugar || "") + '" placeholder="Mercado de San Juan"></div>' +
    "</div>" +

      'letter-spacing:0;font-size:.95rem;font-family:var(--font-serif);color:var(--carbon)">' +
      '<input type="checkbox" id="ePublicado" style="width:auto"' +
      (e.id ? (e.publicado ? " checked" : "") : " checked") + "> Publicada en la página</label></div>" +

    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn" type="submit" id="eGuardar">' + (e.id ? "Guardar los cambios" : "Publicar la entrada") + "</button>" +

  caja.scrollIntoView({ behavior: "smooth", block: "start" });
  pintarGaleria();

  $("#eCancelar").onclick = cerrarEditor;

  const quitar = $("#eQuitarPortada");

    $("#ePortadaPrevia").src = "";
    $("#ePortadaPrevia").classList.add("oculto");
  };

  $("#ePortadaArchivo").onchange = async (ev) => {
    const f = ev.target.files[0];
    if(!f) return;
    const url = await subir(f, "portadas");
    if(url){
      $("#ePortadaPrevia").src = url;
      $("#ePortadaPrevia").classList.remove("oculto");
    }
  };

  $("#eFotosArchivos").onchange = async (ev) => {
    for(const f of Array.from(ev.target.files)){
      const url = await subir(f, "fotos");
      if(url) fotosEditor.push({ src: url, pie: "" });
    }
    ev.target.value = "";
    pintarGaleria();
  };

  $("#eAudioArchivo").onchange = async (ev) => {
    const f = ev.target.files[0];
    if(!f) return;
    const url = await subir(f, "audio");
    if(url) $("#eAudio").value = url;
  };

  $("#formEntradaBit").onsubmit = async (ev) => {
    ev.preventDefault();
    await guardarEntrada(e.id);
  };
}

function cerrarEditor(){
  $("#editorCaja").classList.add("oculto");
  $("#editorCaja").innerHTML = "";
  fotosEditor = [];
}

function pintarGaleria(){
  const g = $("#eGaleria");
  if(!g) return;
  g.innerHTML = fotosEditor.map((f, i) =>
    "<figure><img src=\"" + esc(f.src) + "\" alt=\"\">" +
    '<button type="button" data-quitar="' + i + '" title="Quitar">&times;</button></figure>').join("");
  g.onclick = (ev) => {
    const b = ev.target.closest("[data-quitar]");
    if(!b) return;
    fotosEditor.splice(+b.dataset.quitar, 1);
    pintarGaleria();
  };
}

function avisoEditor(texto, mal){
  const a = $("#avisoEditor");
  if(a) a.innerHTML = '<div class="aviso ' + (mal ? "mal" : "ok") + '">' + esc(texto) + "</div>";
}

/* Sube un archivo al almacén y devuelve su dirección pública. */
async function subir(archivo, carpeta){
  avisoEditor("Subiendo " + archivo.name + "…");
  const limpio = archivo.name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9.]+/g, "-").replace(/^-+|-+$/g, "");
  const ruta = carpeta + "/" + Date.now() + "-" + limpio;
  try {
    await api("/storage/v1/object/medios/" + ruta, {
      method: "POST",
      headers: { "Content-Type": archivo.type || "application/octet-stream", "x-upsert": "true" },
      body: archivo,
    });
    avisoEditor("Listo: " + archivo.name);
    return NUBE.url + "/storage/v1/object/public/medios/" + ruta;
  } catch(ex){
    avisoEditor("No se pudo subir " + archivo.name + ". " + ex.message, true);
    return "";
  }
}

async function guardarEntrada(id){
  const btn = $("#eGuardar");
  const fila = {
    fecha:     $("#eFecha").value || hoyISO(),
    categoria: $("#eCategoria").value,
    titulo:    $("#eTitulo").value.trim(),
    resumen:   $("#eResumen").value.trim(),
    portada:   $("#ePortadaPrevia").classList.contains("oculto") ? "" : $("#ePortadaPrevia").src,
    texto:     $("#eTexto").value.trim(),
    fotos:     fotosEditor,
    video:     $("#eVideo").value.trim(),
    audio:     $("#eAudio").value.trim(),
    mapa:      $("#eMapa").value.trim(),
    lugar:     $("#eLugar").value.trim(),
    publicado: $("#ePublicado").checked,
  };
  if(!fila.titulo) return avisoEditor("Ponle un título a la entrada.", true);

  btn.disabled = true; btn.textContent = "Guardando…";
  try {
    if(id){
      await api("/rest/v1/bitacora?id=eq." + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(fila),
      });
    } else {
      await api("/rest/v1/bitacora", {
        method: "POST",
        headers: { "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(fila),
      });
    }
    cerrarEditor();
    await cargarEntradas();
  } catch(ex){
    avisoEditor("No se pudo guardar. " + ex.message, true);
    btn.disabled = false;
    btn.textContent = id ? "Guardar los cambios" : "Publicar la entrada";
  }
}
